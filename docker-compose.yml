version: '3.8'

services:
  foodparkdigital.api:
    image: foodparkdigital-api
    build:
      context: .
      dockerfile: src/FoodParkDigital.WebApi/Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=FoodParkDigital;User Id=sa;Password=YourStr0ngP@ssw0rd;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - JwtSettings__Secret=FoodParkDigital-SuperSecret-Key-Minimum-32-Characters!!
      - JwtSettings__Issuer=FoodParkDigital
      - JwtSettings__Audience=FoodParkDigital
      - JwtSettings__AccessTokenExpirationMinutes=60
      - JwtSettings__RefreshTokenExpirationDays=7
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStr0ngP@ssw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStr0ngP@ssw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver_data:
