name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build, tests, migrations)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Each action and Docker image runs what was reviewed: a tag can be moved to other code, a commit SHA or a digest
      # cannot. The version stays next to each pin; how to update one is in docs/development/deploy-azure.md.
      - name: Actions and images pinned
        run: python3 .github/scripts/check-pins.py

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FoodParkDigital.sln

      - name: Build
        run: dotnet build FoodParkDigital.sln --no-restore --configuration Release

      # Private files depend on the access level of their Blob container: test classes named *AzuriteTests run against
      # the emulator and are skipped everywhere else. Its connection string is the emulator's public one.
      - name: Start Azurite (Blob Storage emulator)
        run: |
          docker run --detach --name azurite --publish 127.0.0.1:10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
          for _ in $(seq 30); do
            if curl -s -o /dev/null http://127.0.0.1:10000/; then
              exit 0
            fi
            sleep 1
          done
          docker logs azurite
          echo "::error::Azurite did not accept connections."
          exit 1

      - name: Test
        env:
          TIENDITAPP_TEST_AZURE_BLOB: UseDevelopmentStorage=true
        run: dotnet test FoodParkDigital.sln --no-build --configuration Release --verbosity normal

      # The client is generated from client/openapi/openapi.json: it must be the document the API serves now, so a DTO
      # changed without regenerating the client fails here instead of in production. Development serves Swagger and
      # needs no database for it.
      - name: Check the OpenAPI contract
        working-directory: src/FoodParkDigital.WebApi
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5099
          BackgroundJobs__Enabled: "false"
          Database__AutoMigrateOnStartup: "false"
          Database__SeedOnStartup: "false"
        run: |
          dotnet bin/Release/net10.0/FoodParkDigital.WebApi.dll > "$RUNNER_TEMP/api.log" 2>&1 &
          api=$!
          for _ in $(seq 60); do
            curl -sf -o /dev/null http://127.0.0.1:5099/swagger/v1/swagger.json && break
            sleep 1
          done
          node ../../client/scripts/pull-openapi.mjs http://127.0.0.1:5099/swagger/v1/swagger.json || { cat "$RUNNER_TEMP/api.log"; exit 1; }
          kill "$api"
          if ! git diff --exit-code -- ../../client/openapi/openapi.json; then
            echo "::error::client/openapi/openapi.json is not the contract the API serves. Run the API in Development and, in client/, npm run api:pull and npm run api:types."
            exit 1
          fi

      # Breaking changes against the base branch are reported, not blocking: the client in this repository is
      # regenerated in the same change, but an old tab or another integration may still send the previous shape.
      - name: Report breaking API changes
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          mkdir -p "$RUNNER_TEMP/openapi"
          if ! git show "origin/${{ github.base_ref }}:client/openapi/openapi.json" > "$RUNNER_TEMP/openapi/base.json"; then
            echo "The base branch has no OpenAPI contract yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cp client/openapi/openapi.json "$RUNNER_TEMP/openapi/revision.json"
          docker run --rm -v "$RUNNER_TEMP/openapi:/specs:ro" \
            tufin/oasdiff@sha256:b0815c30ec6d99027623ff90acc98d3f7157702ceeedae47d924dc0cf4491fb3 \
            breaking /specs/base.json /specs/revision.json --format markdown --lang es > "$RUNNER_TEMP/openapi/breaking.md"
          {
            echo "## Cambios incompatibles en la API respecto a ${{ github.base_ref }}"
            if [ -s "$RUNNER_TEMP/openapi/breaking.md" ]; then cat "$RUNNER_TEMP/openapi/breaking.md"; else echo "Ninguno."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Fails when an entity configuration changed without its migration.
      - name: Check pending EF Core model changes
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          dotnet ef migrations has-pending-model-changes \
            --project src/FoodParkDigital.Infrastructure \
            --startup-project src/FoodParkDigital.WebApi \
            --configuration Release \
            --no-build

  # Production does not migrate on startup. Without the deploy's automatic migrations, before each
  # merge to master the team runs database/production/<MigrationId>/apply.sql (the SET block below
  # plus the output of `dotnet ef migrations script --idempotent`) with `sqlcmd -b`. SQL Server
  # compiles each migration of that script as one batch, so a statement naming a column added in
  # the same migration fails there even though `dotnet ef database update` passes. This job runs
  # the same script over a database in production's state, and also the deploy's own way
  # (.github/scripts/apply-migrations.sh).
  migrations:
    name: Migrations (SQL Server 2022, sqlcmd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # An explicit bash adds pipefail: a failing `dotnet ef` inside a pipeline fails the step.
    defaults:
      run:
        shell: bash
    env:
      # dotnet ef builds the API host, which outside Development requires a JWT secret.
      ASPNETCORE_ENVIRONMENT: Development
      # A migration production already has, ideally its last one. The script runs over a database
      # in this state because from an empty one it fails in
      # 20260217004713_AddOrderServiceAndTenantCapabilities, which is applied and cannot be edited.
      # Move it forward when production does; an older value only tests more migrations.
      PRODUCTION_BASELINE: 20261004165450_AddOfflineSaleIdempotency
      MSSQL_DATABASE: TienditAppCi
      EF_PROJECTS: >-
        --project src/FoodParkDigital.Infrastructure
        --startup-project src/FoodParkDigital.WebApi
        --configuration Release
        --no-build
      # The runner has no sqlcmd: this is the classic one from the SQL Server image, as in
      # production. -b stops at the first error with a non-zero exit code; -r0 prints errors to
      # stderr, so they show even when the output goes to a file.
      SQLCMD: docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -r0

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/FoodParkDigital.WebApi --configuration Release

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      # Started by a step instead of a service container so the SA password is created inside
      # the job: it is never in the repository, and the runner masks it in the logs.
      - name: Start SQL Server 2022
        run: |
          password="$(openssl rand -hex 24)Aa1"
          echo "::add-mask::$password"
          echo "MSSQL_CONNECTION=Server=127.0.0.1,1433;User ID=sa;Password=$password;Encrypt=True;TrustServerCertificate=True" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/sql"
          MSSQL_SA_PASSWORD="$password" SQLCMDPASSWORD="$password" docker run --detach --name mssql \
            --env ACCEPT_EULA=Y --env MSSQL_SA_PASSWORD --env SQLCMDPASSWORD \
            --publish 127.0.0.1:1433:1433 --volume "$RUNNER_TEMP/sql:/scripts:ro" \
            mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
          for _ in $(seq 60); do
            if $SQLCMD -l 2 -Q "SELECT 1" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs mssql
          echo "::error::SQL Server did not accept connections."
          exit 1

      # Development logs the SQL of every command; `env` silences only that category (its name has
      # dots, so it cannot be a shell variable).
      - name: Create the database at the production baseline
        run: |
          env 'Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Database.Command=Warning' \
            dotnet ef database update "$PRODUCTION_BASELINE" --connection "$MSSQL_CONNECTION;Database=$MSSQL_DATABASE" $EF_PROJECTS

      # The same content as an apply.sql: the SET block of the production scripts and the whole
      # idempotent script, whose batches for applied migrations are compiled and skipped. Classic
      # sqlcmd starts with QUOTED_IDENTIFIER OFF, which filtered indexes reject, and EF Core does
      # not add XACT_ABORT. The BOM that EF writes goes away: sqlcmd rejects one mid-file.
      - name: Generate the idempotent script
        run: |
          cat > "$RUNNER_TEMP/set-options.sql" <<'SQL'
          SET ANSI_NULLS ON;
          SET ANSI_PADDING ON;
          SET ANSI_WARNINGS ON;
          SET ARITHABORT ON;
          SET CONCAT_NULL_YIELDS_NULL ON;
          SET NUMERIC_ROUNDABORT OFF;
          SET QUOTED_IDENTIFIER ON;
          SET XACT_ABORT ON;
          GO
          SQL
          dotnet ef migrations script --idempotent --output "$RUNNER_TEMP/ef-apply.sql" $EF_PROJECTS
          sed '1s/^\xEF\xBB\xBF//' "$RUNNER_TEMP/ef-apply.sql" | cat "$RUNNER_TEMP/set-options.sql" - > "$RUNNER_TEMP/sql/apply.sql"

      - name: Apply the script
        run: |
          $SQLCMD -d "$MSSQL_DATABASE" -i /scripts/apply.sql
          pending=$(dotnet ef migrations list --connection "$MSSQL_CONNECTION;Database=$MSSQL_DATABASE" --json --prefix-output $EF_PROJECTS \
            | sed -n 's/^data: *//p' | jq '[.[] | select(.applied != true)] | length')
          if [ "$pending" != 0 ]; then
            echo "::error::$pending migrations are still pending after the script."
            exit 1
          fi

      - name: Apply the script again (must change nothing)
        run: |
          # Applied migrations, and every object with its last change (ALTER or index included).
          state() {
            $SQLCMD -d "$MSSQL_DATABASE" -h -1 -W -s ' ' -Q "SET NOCOUNT ON;
              SELECT [MigrationId] FROM [__EFMigrationsHistory] ORDER BY [MigrationId];
              SELECT [type], SCHEMA_NAME([schema_id]), [name], [modify_date]
              FROM sys.objects WHERE [is_ms_shipped] = 0 ORDER BY [schema_id], [name];"
          }
          state > "$RUNNER_TEMP/state-before.txt"
          # A later run in production compiles every batch again, including the ones it skips, so a
          # batch naming a column that a newer migration dropped fails there. Without this, SQL Server
          # reuses the plans of the first run and that error goes unnoticed.
          $SQLCMD -Q "DBCC FREEPROCCACHE WITH NO_INFOMSGS;"
          $SQLCMD -d "$MSSQL_DATABASE" -i /scripts/apply.sql
          state > "$RUNNER_TEMP/state-after.txt"
          if ! diff -u "$RUNNER_TEMP/state-before.txt" "$RUNNER_TEMP/state-after.txt"; then
            echo "::error::The second run changed the database."
            exit 1
          fi

      # The Down of every migration after the production baseline, newest first (what the
      # rollback.sql files run), twice: the second time it must do nothing, so each batch has to
      # compile once the columns it names are gone. Then the script again.
      - name: Roll back to the production baseline and apply again
        run: |
          latest=$(dotnet ef migrations list --no-connect --json --prefix-output $EF_PROJECTS \
            | sed -n 's/^data: *//p' | jq -r '.[-1].id')
          if [ "$latest" = "$PRODUCTION_BASELINE" ]; then
            echo "No migrations after $PRODUCTION_BASELINE: nothing to roll back."
            exit 0
          fi
          last_migration() {
            $SQLCMD -d "$MSSQL_DATABASE" -h -1 -W -Q "SET NOCOUNT ON; SELECT MAX([MigrationId]) FROM [__EFMigrationsHistory];"
          }
          dotnet ef migrations script "$latest" "$PRODUCTION_BASELINE" --idempotent --output "$RUNNER_TEMP/ef-rollback.sql" $EF_PROJECTS
          sed '1s/^\xEF\xBB\xBF//' "$RUNNER_TEMP/ef-rollback.sql" | cat "$RUNNER_TEMP/set-options.sql" - > "$RUNNER_TEMP/sql/rollback.sql"
          $SQLCMD -d "$MSSQL_DATABASE" -i /scripts/rollback.sql
          if [ "$(last_migration)" != "$PRODUCTION_BASELINE" ]; then
            echo "::error::The rollback did not return the database to $PRODUCTION_BASELINE."
            exit 1
          fi
          # As with apply.sql: without this, the second run reuses the plans of the first one, and a
          # guard naming a column the rollback already dropped does not fail here as it would there.
          $SQLCMD -Q "DBCC FREEPROCCACHE WITH NO_INFOMSGS;"
          $SQLCMD -d "$MSSQL_DATABASE" -i /scripts/rollback.sql
          if [ "$(last_migration)" != "$PRODUCTION_BASELINE" ]; then
            echo "::error::Run again, the rollback changed the migration history."
            exit 1
          fi
          $SQLCMD -d "$MSSQL_DATABASE" -i /scripts/apply.sql
          if [ "$(last_migration)" != "$latest" ]; then
            echo "::error::After the rollback, the script did not reach $latest again."
            exit 1
          fi

      # How a new database (local development, tests) is created: every migration, one statement
      # at a time.
      - name: Create a new database with dotnet ef database update
        run: |
          env 'Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Database.Command=Warning' \
            dotnet ef database update --connection "$MSSQL_CONNECTION;Database=TienditAppCiNew" $EF_PROJECTS

      # How the deploy migrates the staging copy and production (.github/scripts/apply-migrations.sh):
      # the API as Production, from the production baseline, signed in as a user with only the roles
      # that docs/development/deploy-azure.md gives the deploy identity. A migration that needs more
      # fails here instead of in a release. The second run must find nothing to apply.
      - name: Apply the migrations as the deploy does
        run: |
          database=TienditAppCiDeploy
          env 'Serilog__MinimumLevel__Override__Microsoft.EntityFrameworkCore.Database.Command=Warning' \
            dotnet ef database update "$PRODUCTION_BASELINE" --connection "$MSSQL_CONNECTION;Database=$database" $EF_PROJECTS
          password="$(openssl rand -hex 24)Aa1"
          echo "::add-mask::$password"
          $SQLCMD -d "$database" -Q "CREATE LOGIN [tienditapp-deploy] WITH PASSWORD = N'$password';
            CREATE USER [tienditapp-deploy] FOR LOGIN [tienditapp-deploy];
            ALTER ROLE db_ddladmin ADD MEMBER [tienditapp-deploy];
            ALTER ROLE db_datareader ADD MEMBER [tienditapp-deploy];
            ALTER ROLE db_datawriter ADD MEMBER [tienditapp-deploy];"
          export MIGRATIONS_CONNECTION="Server=127.0.0.1,1433;User ID=tienditapp-deploy;Password=$password;Encrypt=True;TrustServerCertificate=True;Database=$database"
          bash .github/scripts/apply-migrations.sh "CI ($database, desde $PRODUCTION_BASELINE)"
          bash .github/scripts/apply-migrations.sh "CI ($database), otra vez"

      # What depends on SQL Server itself (the folio counters take the next number under a row lock; the lists project
      # in SQL) runs against the same container: test classes named *SqlServerTests, skipped everywhere else. The
      # WebApi ones run the whole API in process: two businesses that try to reach each other's data.
      - name: SQL Server tests
        env:
          TIENDITAPP_TEST_SQLSERVER: ${{ env.MSSQL_CONNECTION }}
        run: |
          dotnet test tests/FoodParkDigital.Infrastructure.Tests --configuration Release --filter "FullyQualifiedName~SqlServerTests"
          dotnet test tests/FoodParkDigital.WebApi.Tests --configuration Release --filter "FullyQualifiedName~SqlServerTests"

      - name: Upload the scripts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: migration-scripts
          path: ${{ runner.temp }}/sql/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Node 20 has no support since April 2026; 24 is the active LTS (Vitest 5 needs 22.12 or later).
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      # The generated types and enums must be the ones openapi/openapi.json produces (the backend job checks that
      # document).
      - name: Check the generated API types
        run: |
          npm run api:types
          if ! git diff --exit-code -- src/api/generated/schema.ts src/api/generated/enums.ts; then
            echo "::error::src/api/generated does not match openapi/openapi.json: run npm run api:types."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # What a first visit downloads before the first screen, against client/bundle-budget.json.
      - name: Check the first-visit budget
        run: node scripts/check-bundle.mjs

      # The visual scenes (client/visual) run locally, but they must keep compiling against the client's types.
      - name: Typecheck the visual scenes
        run: npm run visual:typecheck

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
