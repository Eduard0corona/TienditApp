name: Deploy WebApp (API + SPA)

# Only master reaches production, so an older branch cannot overwrite the published version. A manual run
# started from any other branch is skipped.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  # Only used by azure/login when the OIDC variables exist (see the deploy steps).
  id-token: write

# Never run two deployments of the same app at the same time.
concurrency:
  group: deploy-azure-webapp
  cancel-in-progress: false

# Two ways to reach production (docs/development/deploy-azure.md):
# - Directly (default): the package goes to the app and the smoke test checks it there.
# - Through a staging slot, when the AZURE_WEBAPP_SLOT and AZURE_RESOURCE_GROUP variables exist (OIDC required): the
#   package goes to the slot and is checked there; the `promote` job swaps it into production after the approval of
#   the `production` environment, and checks production. A version that fails in the slot never reaches production.
jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      client-script: ${{ steps.publish-output.outputs.client-script }}

    steps:
      - name: Check the staging slot settings
        if: vars.AZURE_WEBAPP_SLOT != '' && (vars.AZURE_CLIENT_ID == '' || vars.AZURE_RESOURCE_GROUP == '')
        run: |
          echo "::error::AZURE_WEBAPP_SLOT needs OIDC (AZURE_CLIENT_ID) and AZURE_RESOURCE_GROUP: the swap signs in to Azure."
          exit 1

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      # Framework-dependent publish: the App Service stack must be .NET 10.
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FoodParkDigital.sln

      # Nothing is deployed unless the solution builds and every test passes.
      - name: Build and test
        run: |
          dotnet build FoodParkDigital.sln --no-restore --configuration Release
          dotnet test FoodParkDigital.sln --no-build --configuration Release

      - name: Publish backend
        run: dotnet publish src/FoodParkDigital.WebApi/FoodParkDigital.WebApi.csproj -c Release -o ${{ github.workspace }}/publish

      # The script that index.html loads carries the build's hash: the smoke tests look for it.
      - name: Verify publish output
        id: publish-output
        run: |
          test -f "${{ github.workspace }}/publish/FoodParkDigital.WebApi.dll"
          test -f "${{ github.workspace }}/publish/wwwroot/index.html"
          ls -la "${{ github.workspace }}/publish" | head -n 50
          script=$(grep -oE '/assets/index-[^"]+\.js' "${{ github.workspace }}/publish/wwwroot/index.html" | head -n 1)
          test -n "$script"
          echo "client-script=$script" >> "$GITHUB_OUTPUT"

      - name: Create deployment zip
        run: |
          cd "${{ github.workspace }}/publish"
          zip -r "${{ github.workspace }}/webapp.zip" .

      # OIDC (recommended, see docs/development/deploy-azure.md): with the AZURE_CLIENT_ID, AZURE_TENANT_ID and
      # AZURE_SUBSCRIPTION_ID repository variables, the deployment signs in with a federated credential and no
      # long-lived secret. Without them it keeps using the publish profile, as before.
      - name: Sign in to Azure (OIDC)
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # To the staging slot when there is one; production keeps serving the previous version until the swap.
      - name: Deploy to Azure Web App (OIDC)
        id: deploy-oidc
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT || 'production' }}
          package: ${{ github.workspace }}/webapp.zip

      - name: Deploy to Azure Web App (publish profile)
        id: deploy-profile
        if: vars.AZURE_CLIENT_ID == ''
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/webapp.zip

      # The deployment is done when the app (or the slot) answers with this version: ready (database reachable), with
      # every migration of this version in the database (a missing apply.sql stops it here) and serving the index.html
      # just built. SMOKE_TEST_URL (a repository variable) overrides the production address, for a custom domain; a slot
      # is checked at its own address.
      - name: Smoke test
        env:
          APP_URL: ${{ (vars.AZURE_WEBAPP_SLOT == '' && vars.SMOKE_TEST_URL) || steps.deploy-oidc.outputs.webapp-url || steps.deploy-profile.outputs.webapp-url }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::The deployment gave no URL and SMOKE_TEST_URL is not set: smoke test skipped."
            exit 0
          fi
          bash .github/scripts/smoke-test.sh "$APP_URL" "${{ steps.publish-output.outputs.client-script }}"

  # Only with a staging slot. The `production` environment holds the approval: with required reviewers in its settings,
  # the swap waits for one of them. The OIDC subject of this job is the environment
  # (repo:Eduard0corona/TienditApp:environment:production), which needs its own federated credential.
  promote:
    needs: build-and-deploy
    if: vars.AZURE_WEBAPP_SLOT != ''
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          sparse-checkout: .github/scripts

      - name: Sign in to Azure (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The slot already started this version, so production changes without a cold start. The previous version stays
      # in the slot: swapping again goes back to it.
      - name: Swap the slot into production
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "$APP_NAME" \
            --slot "${{ vars.AZURE_WEBAPP_SLOT }}" \
            --target-slot production

      - name: Smoke test (production)
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME }}
          APP_URL: ${{ vars.SMOKE_TEST_URL }}
        run: |
          url="${APP_URL:-https://$(az webapp show --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "$APP_NAME" --query defaultHostName --output tsv)}"
          bash .github/scripts/smoke-test.sh "$url" "${{ needs.build-and-deploy.outputs.client-script }}"
