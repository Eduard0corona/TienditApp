name: Deploy WebApp (API + SPA)

# Only master reaches production, so an older branch (develop included) cannot overwrite the published
# version. A manual run started from any other branch is skipped.
on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments of the same app at the same time.
concurrency:
  group: deploy-azure-webapp
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Build frontend
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run build

      # Framework-dependent publish: the App Service stack must be .NET 10.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FoodParkDigital.sln

      # Nothing is deployed unless the solution builds and every test passes.
      - name: Build and test
        run: |
          dotnet build FoodParkDigital.sln --no-restore --configuration Release
          dotnet test FoodParkDigital.sln --no-build --configuration Release

      - name: Publish backend
        run: dotnet publish src/FoodParkDigital.WebApi/FoodParkDigital.WebApi.csproj -c Release -o ${{ github.workspace }}/publish

      - name: Verify publish output
        run: |
          test -f "${{ github.workspace }}/publish/FoodParkDigital.WebApi.dll"
          test -f "${{ github.workspace }}/publish/wwwroot/index.html"
          ls -la "${{ github.workspace }}/publish" | head -n 50

      - name: Create deployment zip
        run: |
          cd "${{ github.workspace }}/publish"
          zip -r "${{ github.workspace }}/webapp.zip" .

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/webapp.zip
