name: Claude Code Review

# Only pull requests into master, the production branch: every merge to it deploys.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches:
      - master

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Forks: secrets are not exposed, skip instead of failing.
    # Drafts: reviewed once they move to ready_for_review.
    # Dependabot-triggered runs get no Actions secrets, skip them too.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Inline review comments (Claude) and the summary comment (publish step).
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1

      # Gives Claude the inline comments already on the PR so a new push
      # (synchronize) does not repeat the same findings.
      - name: Collect existing inline comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .claude-review
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/comments" \
            --jq '.[] | {path, line, author: .user.login, body: (.body | .[0:400])}' \
            > .claude-review/existing-comments.jsonl

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@756cc22e19660d20e8cc9496b4f242475a7f7790 # v1.0.235
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request into master (production: every merge deploys) against the
            rules of this repository: AGENTS.md at the root (its "Guardrails" and "Code Review
            Rules"), the nested AGENTS.md of each layer the diff touches (client/, tests/ and
            src/FoodParkDigital.*/), docs/ai/guardrails.md and docs/ai/review-checklist.md.

            Work alone and in order in this session: you have no subagents, and do not run any
            command in the background. Use only Read/Glob/Grep on the checkout, `gh pr view`,
            `gh pr diff` and the inline comment tool; other commands are denied.

            1. Read the PR with `gh pr view <PR NUMBER>` and the diff with `gh pr diff <PR NUMBER>`;
               `gh pr view <PR NUMBER> --json files` lists every changed file with its size.
               Use Read/Grep/Glob on the checkout for surrounding context.
            2. If the diff is too large to review whole (several thousand lines), cover it layer by
               layer in this order: src/FoodParkDigital.Domain, src/FoodParkDigital.Application,
               src/FoodParkDigital.Infrastructure (its Persistence/Migrations and
               database/production first), src/FoodParkDigital.WebApi, tests, then client and
               everything else. Finish every file you start.
            3. Report only concrete, verifiable problems: correctness bugs, guardrail violations
               (layer dependencies, tenant isolation, roles/permissions/capabilities, money and
               inventory, state transitions, migrations, domain events), security issues and
               contract drift (DTOs, OpenAPI, generated client). Skip style nits.
            4. Severity:
               - BLOCKER: what the root AGENTS.md "Code Review Rules" block: tenant bypass,
                 direct state change, wrong money, lost history, secrets, unsafe migration,
                 broken contract or weakened tests.
               - MAJOR: any other correctness bug or guardrail violation.
               - MINOR: a concrete, low-impact problem (for example a missing test for a case
                 the PR changes).
            5. Read .claude-review/existing-comments.jsonl: the inline comments already on this PR
               (`line: null` means outdated or file-level). For each NEW finding tied to a changed
               line, post one inline comment with
               `mcp__github_inline_comment__create_inline_comment` (confirmed: true).
               Do not re-post a finding already raised on the same path and line.
            6. Do not post any top-level comment. When you are done with everything you reviewed,
               return the result as structured output:
               - blocker/major/minor: severity counts covering ALL findings that currently apply
                 in what you reviewed (new and previously raised).
               - incomplete: true if any part of the diff went unreviewed, for whatever reason;
                 false only when you reviewed all of it.
               - skipped: the paths or directories you did not review; empty when incomplete is
                 false.
               - summary: markdown. Its first line says what you reviewed, then one line per
                 finding (`SEVERITY path:line - problem`), or one line saying there are none.
            Write comments and the summary in Spanish, like the repository's docs and PRs.
            Do not modify files, push commits, approve or merge.
          # Minimum tool surface: read the PR/diff, read the checkout, post inline comments.
          # No subagents: the Agent tool (formerly Task) runs them in the background, and on PR #97
          # the structured output was forced before any of them returned.
          # The summary is returned as structured output and published by the next step.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          claude_args: |
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Agent,Task"
            --json-schema '{"type":"object","properties":{"blocker":{"type":"integer","minimum":0},"major":{"type":"integer","minimum":0},"minor":{"type":"integer","minimum":0},"incomplete":{"type":"boolean"},"skipped":{"type":"array","items":{"type":"string"}},"summary":{"type":"string"}},"required":["blocker","major","minor","incomplete","skipped","summary"],"additionalProperties":false}'

      # The action logs only a sanitized summary of Claude's result, so a failed call (invalid or expired token, usage
      # limit, unavailable model) shows up as "did not return structured_output". The reason stays in its execution
      # file: print only the error of the result, between stop-commands because it is not our text.
      - name: Show why Claude failed
        if: failure() && steps.claude-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          reason=$(jq -r '.[] | select(.type == "result" and .is_error) | (.result // empty), (.errors // [] | .[])' \
            "$EXECUTION_FILE" | head -c 2000)
          stop=$(uuidgen)
          echo "::stop-commands::$stop"
          echo "${reason:-The execution file has no error message.}"
          echo "::$stop::"

      # Creates or updates a single summary comment, found by its hidden marker.
      - name: Publish review summary
        if: steps.claude-review.outputs.structured_output != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # Passed through env, never interpolated into the script: it is model output.
          RESULT: ${{ steps.claude-review.outputs.structured_output }}
        run: |
          marker='<!-- claude-code-review -->'
          # Anything listed as skipped makes the review incomplete, whatever the flag says.
          incomplete=$(jq '.incomplete or (.skipped | length > 0)' <<<"$RESULT")
          body=$(jq -r --arg m "$marker" --argjson incomplete "$incomplete" '
            "\($m)\n**BLOCKER** \(.blocker) · **MAJOR** \(.major) · **MINOR** \(.minor)"
            + (if $incomplete then
                "\n\n**Revisión incompleta**: los conteos cubren solo lo revisado."
                + (if (.skipped | length) > 0
                    then " Sin revisar:\n" + (.skipped | map("- \(.)") | join("\n"))
                    else "" end)
              else "" end)
            + "\n\n\(.summary)"' <<<"$RESULT")

          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | tail -n1)

          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

          # The check turns red with BLOCKER findings or when part of the diff went unreviewed,
          # so a green run means a complete review. Remove this block if the review should not
          # gate merges.
          status=0
          if [ "$(jq '.blocker' <<<"$RESULT")" -gt 0 ]; then
            echo "::error::Claude review reported BLOCKER findings"
            status=1
          fi
          if [ "$incomplete" = true ]; then
            echo "::error::Claude review is incomplete: part of the diff was not reviewed (see the summary comment)"
            status=1
          fi
          exit "$status"
